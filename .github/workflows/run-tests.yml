name: run-tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: [8.4]
        laravel: [12.*, 13.*]
        stability: [prefer-stable]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: pcov

      - name: Install dependencies
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci --coverage --min=90

  test-pgsql:
    runs-on: ubuntu-latest
    name: P8.4 - pgsql real-engine

    steps:
      # Started first so the engine boots while PHP and the dependencies install. The data
      # directory is tmpfs and durability is off: the same planner, isolation levels, locks and
      # limits — nothing this leg proves depends on surviving a power cut.
      - name: Start postgres
        run: >-
          docker run -d --name postgres --tmpfs /var/lib/postgresql/data
          -e POSTGRES_DB=testing -e POSTGRES_USER=testing -e POSTGRES_PASSWORD=secret
          -p 5432:5432 postgres:16
          -c fsync=off -c synchronous_commit=off -c full_page_writes=off

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pgsql, pdo_pgsql, bcmath, intl, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      # The image's init server listens on the socket only, so a TCP answer means the real one is up.
      - name: Wait for postgres
        run: |
          for _ in $(seq 1 90); do
            docker exec postgres psql -h 127.0.0.1 -U testing -d testing -c 'select 1' >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs postgres
          exit 1

      - name: Execute tests against postgres
        env:
          # TESTING_DB_DRIVER is what moves the suite off sqlite. The TESTING_DB_*
          # location vars alone only say where the engine is: without the driver this
          # job would run every test on sqlite and still call itself a postgres leg.
          #
          # Requests ships one CREATE and no foreign keys, so the leg is not here for
          # ordering. It is here for the columns: `meta` and `require_approvals_from`
          # are jsonb, which has no equality operator on sqlite's terms at all, and
          # `status` is an enum-backed string. The uuid / ulid key-type legs
          # (tests/KeyTypes) are here too: sqlite's type affinity stores an integer id
          # in a uuid morph column, Postgres refuses it. Only a real engine proves the
          # shipped table is usable rather than merely creatable.
          TESTING_DB_DRIVER: pgsql
          TESTING_DB_HOST: 127.0.0.1
          TESTING_DB_PORT: 5432
          TESTING_DB_DATABASE: testing
          TESTING_DB_USERNAME: testing
          TESTING_DB_PASSWORD: secret
        # Coverage is enforced on the sqlite matrix; this is a correctness leg, and
        # re-measuring it doubles the slowest job for no signal.
        run: vendor/bin/pest --ci

  test-mysql:
    runs-on: ubuntu-latest
    name: P8.4 - mysql real-engine

    steps:
      # Started first, tmpfs datadir, binlog off and no flush per commit — the same InnoDB,
      # isolation levels, locking and limits. performance_schema stays at its default.
      - name: Start mysql
        run: >-
          docker run -d --name mysql --tmpfs /var/lib/mysql
          -e MYSQL_DATABASE=testing -e MYSQL_USER=testing -e MYSQL_PASSWORD=secret -e MYSQL_ROOT_PASSWORD=secret
          -p 3306:3306 mysql:8
          --skip-log-bin --sync-binlog=0 --innodb-flush-log-at-trx-commit=0 --innodb-doublewrite=OFF

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, mysql, pdo_mysql, bcmath, intl, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      # The image's init server runs with networking off, so a TCP answer means the real one is up.
      - name: Wait for mysql
        run: |
          for _ in $(seq 1 90); do
            docker exec mysql mysql -h 127.0.0.1 -uroot -psecret -e 'select 1' testing >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs mysql
          exit 1

      - name: Execute tests against mysql
        env:
          # The requests table rides on the approvals engine's tables, whose composite
          # morph indexes have to fit under InnoDB's 3072-byte key limit with utf8mb4. The
          # jsonb columns become plain `json` here, and the status writes take a real
          # `for update` row lock. The uuid / ulid key-type legs (tests/KeyTypes) run the
          # char(36) / char(26) morph columns through the same engine.
          TESTING_DB_DRIVER: mysql
          TESTING_DB_HOST: 127.0.0.1
          TESTING_DB_PORT: 3306
          TESTING_DB_DATABASE: testing
          TESTING_DB_USERNAME: root
          TESTING_DB_PASSWORD: secret
        # Coverage is enforced on the sqlite matrix; this is a correctness leg.
        run: vendor/bin/pest --ci
